name: Public demo — sanitized ABA NPPES pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/public_demo.yml'

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sanitized source (no CRM exports)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate fictional inputs and run three-stage proof
        run: python scripts/demo_three_runs.py
      - name: Upload only synthetic demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-${{ github.run_number }}
          path: outputs/public_demo/
          retention-days: 7
